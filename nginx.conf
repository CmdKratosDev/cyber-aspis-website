server {
    listen 80;
    server_name _ cyber-aspis.de www.cyber-aspis.de;
    root /usr/share/nginx/html;
    index index.html;

    # ── Security Headers (OWASP Baseline) ────────────────────────────────────
    add_header X-Frame-Options            "SAMEORIGIN"                                         always;
    add_header X-Content-Type-Options     "nosniff"                                            always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin"                    always;
    add_header Permissions-Policy         "camera=(), microphone=(), geolocation=()"           always;

    # CSP: connect-src erlaubt externe APIs für Threat-Feed + /api/contact intern
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https://stats.cyber-aspis.de; script-src 'self' 'unsafe-inline' https://stats.cyber-aspis.de; connect-src 'self' https://stats.cyber-aspis.de; object-src 'none'; base-uri 'self';" always;

    # HSTS aktiv (HTTPS läuft stabil)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # ── Static Files ──────────────────────────────────────────────────────────
    # Kein SPA-Fallback: Diese Seite besteht aus einzelnen HTML-Dateien, es gibt
    # kein clientseitiges Routing. Der frühere Fallback auf /index.html hat jeden
    # unbekannten Pfad mit HTTP 200 und der Startseite beantwortet (Soft 404) —
    # ein fehlgeschlagener Deploy war dadurch von außen nicht zu erkennen.
    location / {
        try_files $uri $uri/ =404;
    }

    # Gedruckte Kurzadressen (Akquise-Briefe, Art.-14-Hinweis) ohne .html.
    # Anlass 21.09.2026: DA-Pass 5 rief die in allen Briefen gedruckte Adresse
    # cyber-aspis.de/datenschutz auf und bekam 404 — die Datei heisst datenschutz.html.
    # Regex statt "=", damit auch die Schreibweise mit Schraegstrich greift
    # (DA-Pass 6, Befund 8: /datenschutz/ war in Pass 5 als 404 protokolliert).
    # Absolut mit https, weil TLS bei Traefik endet und $scheme hier "http" ist -
    # ein relatives 301 wuerde ueber einen Klartext-Zwischenschritt fuehren (DA-Pass 7, 7a).
    location ~ ^/(datenschutz|impressum)/?$ {
        return 301 https://$host/$1.html;
    }

    # Eigene 404-Seite. Liegt in assets/, weil der Entrypoint auf dem VPS nur
    # explizit gelistete Pfade kopiert und assets/ bereits darin steht — so
    # braucht der Fix keinen Handgriff am Server. `internal` verhindert, dass
    # die Seite unter ihrer eigenen URL erreichbar ist; der Browser behält die
    # ursprünglich angefragte Adresse, deshalb sind alle Pfade darin absolut.
    error_page 404 /assets/404.html;
    location = /assets/404.html {
        internal;
    }

    # favicon ohne 404-Logging
    location = /favicon.ico {
        log_not_found off;
        access_log    off;
    }

    # robots.txt
    location = /robots.txt {
        log_not_found off;
        access_log    off;
    }

    # security.txt (RFC 9116) — Inline-Return, weil .well-known/ nicht
    # vom entrypoint in den Webroot kopiert wird. Bei Inhaltsänderung:
    # diesen Block UND .well-known/security.txt im Repo synchron halten.
    location = /.well-known/security.txt {
        default_type text/plain;
        charset utf-8;
        return 200 "Contact: mailto:security@cyber-aspis.de\nExpires: 2027-04-30T18:00:00.000Z\nPreferred-Languages: de, en\nCanonical: https://cyber-aspis.de/.well-known/security.txt\n";
    }

    # ── CISA KEV Proxy (kein CORS-Header bei CISA → same-origin Proxy) ───────
    location = /api/cisa-kev {
        proxy_pass https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json;
        # Keine Besucher-Kennungen an den Anbieter durchreichen. Eine Sperrliste
        # einzelner Header reicht nicht (X-Forwarded-For von Traefik, sec-ch-ua*,
        # sec-fetch-*, DNT ... DA-Pass 10, 1): Alle Request-Header aus, dann nur
        # das setzen, was der Upstream braucht.
        proxy_pass_request_headers off;
        proxy_set_header Host $proxy_host;
        proxy_set_header User-Agent "cyber-aspis.de-feed";
        proxy_set_header Accept "application/json";
        # Die Datei ist 1,7 MB roh, ~190 KB komprimiert (gemessen 21.09.2026).
        # Komprimiert anfordern und nur fuer Clients ohne gzip-Unterstuetzung
        # auspacken (gunzip-Modul ist im offiziellen Image enthalten, geprueft
        # per nginx -V; DA-Pass 11, 3). Zwischenspeicher-Sicherheit: CISA sendet
        # selbst "Vary: Accept-Encoding", nginx reicht ihn durch (gemessen mit
        # curl -sI gegen cisa.gov; DA-Pass 12, 8) - kein add_header noetig.
        # Laesst CISA den Header kuenftig weg, muss er hier gesetzt werden -
        # dann aber mit allen vier Sicherheits-Headern des server-Blocks (s. o.).
        proxy_set_header Accept-Encoding "gzip";
        gunzip on;
        proxy_ssl_server_name on;
        resolver 8.8.8.8 valid=300s;
        resolver_timeout 5s;
        proxy_connect_timeout 10s;
        proxy_read_timeout 15s;
        # expires statt add_header: add_header im Location-Block wuerde die
        # Sicherheits-Header des server-Blocks (CSP, HSTS, nosniff) fuer diese
        # Antworten abschalten - nginx vererbt add_header nicht (DA-Pass 7, 7c).
        # Access-Control-Allow-Origin entfaellt, der Aufruf ist same-origin.
        expires 10m;
    }

    # HackerNews-Feed ueber den eigenen Server statt direkt aus dem Browser,
    # damit keine Besucher-IP an Algolia (USA) geht. Query-String wird von
    # nginx unveraendert angehaengt. (DA-Pass Website 21.09.2026, Befund 5)
    # Feste Abfrage; das einzige, was der Browser mitgibt, ist der Zeitstempel
    # "seit" als 10-stellige Zahl im Pfad (/api/hn/1758400000). Weil proxy_pass
    # Variablen enthaelt, haengt nginx den Query-String des Besuchers NICHT an -
    # kein offener Relay (DA-Pass 7, 7b). Relevanz-Suche ("search"), nicht
    # search_by_date: die lieferte Weltpolitik und Retro-Computing (DA-Pass 8, 1).
    # Test nach Deploy (DA-Pass 10, 5 - der Test muss fehlschlagen KOENNEN, und
    # der Parameter darf im festen Query NICHT vorkommen):
    #   /api/hn/<seit>?page=99  ->  hits.length 20 = dicht, 0 = durchgereicht.
    # In Anfuehrungszeichen, weil nginx {10} sonst als Block-Klammer liest (nginx -t: "missing closing parenthesis").
    location ~ "^/api/hn/(\d{10})$" {
        set $hn_query "tags=story&query=security&numericFilters=created_at_i%3E$1,points%3E10&hitsPerPage=20";
        proxy_pass https://hn.algolia.com/api/v1/search?$hn_query;
        proxy_pass_request_headers off;
        proxy_set_header Host $proxy_host;
        proxy_set_header User-Agent "cyber-aspis.de-feed";
        proxy_set_header Accept "application/json";
        proxy_ssl_server_name on;
        resolver 8.8.8.8 valid=300s;
        resolver_timeout 5s;
        proxy_connect_timeout 10s;
        proxy_read_timeout 15s;
        expires 10m;
    }

    # ── Kontaktformular via PHP-FPM (PHPMailer + Hostinger SMTP) ─────────────
    location = /contact.php {
        include        fastcgi_params;
        fastcgi_pass   php:9000;
        fastcgi_param  SCRIPT_FILENAME /var/www/html/contact.php;
        fastcgi_param  REQUEST_METHOD  $request_method;
        fastcgi_param  CONTENT_TYPE    $content_type;
        fastcgi_param  CONTENT_LENGTH  $content_length;
        fastcgi_read_timeout 15s;
    }

    # ── Gzip ──────────────────────────────────────────────────────────────────
    gzip            on;
    gzip_vary       on;
    gzip_min_length 256;
    # text/html ist bei gzip immer dabei; es hier zu nennen erzeugt nur die
    # Warnung "duplicate MIME type" bei nginx -t (offen seit 25.08., DA-Pass Website).
    gzip_types      text/css text/javascript application/javascript application/json
                    image/svg+xml font/woff2;

    # ── Cache-Control für Assets ───────────────────────────────────────────────
    location ~* \.(woff2|woff|ttf|png|ico|svg|jpg|jpeg|gif|webp)$ {
        # Kein add_header hier: es wuerde CSP/HSTS/nosniff fuer diese Antworten
        # abschalten (nginx vererbt add_header nicht, DA-Pass 7, 7c). expires setzt
        # Cache-Control: max-age selbst.
        expires 1y;
    }
    location ~* \.(css|js)$ {
        expires 1M;
    }
}
